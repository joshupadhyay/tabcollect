[project]
name = "tabsweep"
version = "0.1.0"
description = "CLI tool to categorize and organize browser tabs into Obsidian notes"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "anthropic>=0.39.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tabsweep = "tabsweep.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
